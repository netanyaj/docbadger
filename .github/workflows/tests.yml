name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Confidence-tier calibration check
        # Architecture Section 19 point 4 -- zero API cost (no LLM calls),
        # so it runs on every push/PR alongside the unit suite, unlike the
        # real eval-regression-gate.yml workflow (which makes real, paid
        # API calls and is path-filtered to prompt-relevant changes only).
        run: python scripts/confidence_calibration_check.py --verbose
